[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "segmentation-shiftbench"
version = "0.1.0"
description = "A reproducible CPU experiment for segmentation under photometric shifts"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Aymen Benalia"}]
dependencies = ["torch>=2.2,<3", "numpy>=1.24,<3", "pandas>=2,<4", "scikit-learn>=1.3,<2", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
shiftbench = "segmentation_shiftbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
